<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23211e"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d78e"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8c6f2d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#e5c483"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#c5a059" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Futuristic Geometric Cityscape / Agent Core Architecture -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Circuit grid lines -->
    <path d="M 4 22 L 22 4 L 40 22 L 22 40 Z" fill="none" stroke="#c5a059" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2,2"/>
    
    <!-- Left Structure -->
    <path d="M 8 34 L 8 23 L 14 17 L 14 34 Z" fill="#8c6f2d" opacity="0.9"/>
    
    <!-- Right Structure -->
    <path d="M 30 34 L 30 17 L 36 23 L 36 34 Z" fill="#c5a059" opacity="0.9"/>

    <!-- Central Monolith / Tower -->
    <path d="M 17 34 L 17 18 L 22 13 L 27 18 L 27 34 Z" fill="url(#goldGrad)" />

    <!-- Central Neural / Agent Core -->
    <polygon points="22,6 26,10 22,14 18,10" fill="#ffffff" />
    <circle cx="22" cy="10" r="2.2" fill="#f5d78e" />

    <!-- Tech Baseline -->
    <line x1="6" y1="36" x2="38" y2="36" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Sub-nodes -->
    <circle cx="11" cy="36" r="1.5" fill="#f5d78e"/>
    <circle cx="22" cy="36" r="2" fill="#ffffff"/>
    <circle cx="33" cy="36" r="1.5" fill="#f5d78e"/>
  </g>
</svg>
